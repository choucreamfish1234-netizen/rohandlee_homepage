<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>로앤이 채권추심센터 · 반응형 초안 검토</title><style>*{box-sizing:border-box}body{margin:0;background:#dfe4dc;color:#19392b;font-family:system-ui,sans-serif}.toolbar{background:#f6f5f0;padding:18px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #a9b6a5}.toolbar strong{margin-right:auto;font-size:15px}.toolbar label{font-size:13px}.toolbar select,.toolbar a{padding:9px;border:1px solid #a9b6a5;border-radius:3px;background:#fff;color:inherit;font-size:13px;text-decoration:none}.stage{overflow:auto;padding:24px;min-height:calc(100vh - 85px)}iframe{display:block;width:390px;height:820px;border:0;margin:auto;background:#f6f5f0;box-shadow:0 8px 35px #1b392526}p{margin:0;font-size:11px;color:#53694f}@media(max-width:600px){.stage{padding:12px}.toolbar{padding:14px}.toolbar strong{width:100%}}</style></head><body><div class="toolbar"><strong>ROH &amp; LEE · 채권추심센터 초안</strong><label>화면 폭 <select id="width"><option value="375">모바일 375px</option><option value="390" selected>모바일 390px</option><option value="768">태블릿 768px</option><option value="1440">데스크톱 1440px</option></select></label><label>페이지 <select id="page"><option value="/collection">채권추심센터</option></select></label><a href="/collection">페이지 직접 열기 ↗</a><p>초안 검토용 · 운영 사이트 미반영</p></div><div class="stage"><iframe id="preview" title="채권추심센터 반응형 미리보기" src="/collection"></iframe></div><script>const frame=document.getElementById('preview');document.getElementById('width').addEventListener('change',e=>{frame.style.width=e.target.value+'px'});document.getElementById('page').addEventListener('change',e=>{frame.src=e.target.value});</script></body></html>
