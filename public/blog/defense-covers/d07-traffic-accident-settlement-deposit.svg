<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>교통사고 형사합의금과 형사공탁, 합의가 어려울 때 진행 방법과 주의점</title><rect width="1200" height="630" fill="#f4f5ee"/><rect x="0" width="22" height="630" fill="#294934"/><path d="M900 0H1200V630H1060Z" fill="#e4eadf"/><text x="150" y="110" fill="#486248" font-family="sans-serif" font-size="23" letter-spacing="5">ROH &amp; LEE · CRIMINAL DEFENSE</text><text x="150" y="182" fill="#556b56" font-family="sans-serif" font-size="28">형사대응 / 87</text><text x="150" y="270" fill="#243d2e" font-family="sans-serif" font-weight="700" font-size="42"><tspan x="150" dy="0">교통사고 형사합의금과 형사공탁,</tspan><tspan x="150" dy="62">합의가 어려울 때 진행 방법과</tspan><tspan x="150" dy="62">주의점</tspan></text><line x1="150" y1="519" x2="1050" y2="519" stroke="#bccbb7"/><text x="150" y="574" fill="#486248" font-family="sans-serif" font-size="24">법률사무소 로앤이 · 형사 사건 대응팀</text></svg>